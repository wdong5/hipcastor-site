<!DOCTYPE html>
<html lang="en">

  {% include head.html %}

  <body>

    <a class="skip-link" href="#main-content">Skip to main content</a>

    {% include header.html %}

    <main id="main-content">
      <div class="container-fluid">
        <div class="row">
          {{ content }}
        </div>
      </div>

      <div class="text-center my-4">
        <img src="{{ '/images/logopic/osu-logo.jpg' | relative_url }}" style="width: 210px; mix-blend-mode: multiply;" loading="lazy" decoding="async" alt="Oregon State University">
      </div>
    </main>

    {% include footer.html %}

    <!-- Fixed hills at bottom of viewport -->
    <div class="treeline-fixed" aria-hidden="true"></div>

  </body>

</html>
