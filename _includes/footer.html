<script>
  (function () {
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('revealed');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px 120px 0px' });

    document.querySelectorAll('.hpc-card, #gridid .hpc-item, .hpc-pic-card').forEach(function (el) {
      if (el.closest('#textid')) { el.classList.add('revealed'); return; }
      observer.observe(el);
    });
  })();

  window.addEventListener('load', function () {
    if (typeof bootstrap !== 'undefined') {
      var noAutoplay = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      document.querySelectorAll('[data-bs-ride="carousel"]').forEach(function (el) {
        if (noAutoplay) {
          el.removeAttribute('data-bs-ride');
          el.setAttribute('data-bs-interval', 'false');
        }
        bootstrap.Carousel.getOrCreateInstance(el);
      });
    }
  });

  (function () {
    var BATCH = 4;
    var card = document.getElementById('news-card');
    if (!card) return;

    var items = Array.from(card.querySelectorAll('.hpc-item'));
    if (items.length <= BATCH) return;

    var shown = BATCH;
    items.slice(shown).forEach(function (el) { el.style.display = 'none'; });

    /* "Show more" button — keyboard-accessible fallback for scroll-reveal */
    var btn = document.createElement('a');
    btn.href = '#';
    btn.className = 'hpc-arrow-link';
    btn.textContent = 'Show more news';
    btn.style.cssText = 'display:block;text-align:center;margin:1rem 0;';
    card.parentNode.insertBefore(btn, card.nextSibling);

    function showMore() {
      items.slice(shown, shown + BATCH).forEach(function (el) { el.style.display = ''; });
      shown += BATCH;
      if (shown >= items.length) btn.style.display = 'none';
    }

    btn.addEventListener('click', function (e) {
      e.preventDefault();
      showMore();
    });

    /* If the page is too short to scroll, show everything immediately */
    if (document.documentElement.scrollHeight <= window.innerHeight + 50) {
      items.forEach(function (el) { el.style.display = ''; });
      btn.style.display = 'none';
      return;
    }

    var scrollPending = false;
    function onScroll() {
      if (scrollPending) return;
      scrollPending = true;
      requestAnimationFrame(function () {
        scrollPending = false;
        var remaining = document.documentElement.scrollHeight - window.scrollY - window.innerHeight;
        if (remaining > 300) return;
        showMore();
        if (shown >= items.length) {
          window.removeEventListener('scroll', onScroll);
          btn.style.display = 'none';
        }
      });
    }

    window.addEventListener('scroll', onScroll, { passive: true });
  })();
</script>

<script>
  /* Rotating tesseract (Q4 hypercube) — canvas version.
     Eliminates ~416 setAttribute calls/frame from the SVG version.
     Projects 4D vertices via perspective (4D→3D) then orthographic (3D→2D),
     rotating simultaneously in the XW and YZ planes. */
  (function () {
    var svg = document.querySelector('.hpc-topology');
    if (!svg) return;

    var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* Wrap the SVG so we can overlay a canvas at the same size */
    var wrapper = document.createElement('span');
    wrapper.style.cssText = 'display:inline-block;position:relative;vertical-align:middle;';
    svg.parentNode.insertBefore(wrapper, svg);
    wrapper.appendChild(svg);

    var canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;';
    wrapper.appendChild(canvas);

    /* Hide SVG visuals but keep it for layout sizing */
    svg.style.visibility = 'hidden';

    var dpr = window.devicePixelRatio || 1;
    var rect = svg.getBoundingClientRect();
    wrapper.style.width = rect.width + 'px';
    wrapper.style.height = rect.height + 'px';
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    var ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    var W = rect.width;
    var H = rect.height;

    var ORANGE = '#d74009';
    var BLUE   = '#158CBA';
    var DW     = 2.5;
    var SCALE  = H * 0.14;
    var CX = W * 0.5, CY = H * 0.5;

    var verts = [];
    for (var i = 0; i < 16; i++) {
      verts.push([
        (i & 1) ? 1 : -1,
        (i & 2) ? 1 : -1,
        (i & 4) ? 1 : -1,
        (i & 8) ? 1 : -1
      ]);
    }

    var edges = [];
    for (var a = 0; a < 16; a++) {
      for (var b = a + 1; b < 16; b++) {
        var xor = a ^ b;
        if (xor && !(xor & (xor - 1))) edges.push([a, b]);
      }
    }

    function project(v, t) {
      var ra = t * 0.35;
      var cosA = Math.cos(ra), sinA = Math.sin(ra);
      var x  = v[0] * cosA - v[3] * sinA;
      var w  = v[0] * sinA + v[3] * cosA;
      var rb = t * 0.22;
      var cosB = Math.cos(rb), sinB = Math.sin(rb);
      var y  = v[1] * cosB - v[2] * sinB;
      var sw = DW / (DW - w);
      return { x: x * sw * SCALE + CX, y: y * sw * SCALE + CY, d: sw };
    }

    var rafId = null;
    var TAU = Math.PI * 2;

    function drawFrame(t) {
      ctx.clearRect(0, 0, W, H);

      var pts = new Array(16);
      for (var i = 0; i < 16; i++) pts[i] = project(verts[i], t);

      for (var i = 0; i < edges.length; i++) {
        var e = edges[i];
        var p1 = pts[e[0]], p2 = pts[e[1]];
        var d = (p1.d + p2.d) * 0.5;
        var color = d > 1.2 ? ORANGE : BLUE;
        var alpha = Math.min(0.85, 0.1 + d * 0.42);

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = color;
        ctx.lineWidth = 0.4 + d * 0.45;
        ctx.globalAlpha = alpha;
        ctx.stroke();

        var speed = 0.20 + (i % 5) * 0.04;
        var phase = ((t * speed) + i * 0.6180) % 1;
        var px = p1.x + phase * (p2.x - p1.x);
        var py = p1.y + phase * (p2.y - p1.y);
        ctx.beginPath();
        ctx.arc(px, py, 1.2 + d * 0.35, 0, TAU);
        ctx.fillStyle = color;
        ctx.globalAlpha = Math.min(0.95, 0.25 + d * 0.42);
        ctx.fill();
      }

      for (var i = 0; i < 16; i++) {
        var p = pts[i];
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(1.8, 1.8 + p.d * 1.2), 0, TAU);
        ctx.fillStyle = p.d > 1.2 ? ORANGE : BLUE;
        ctx.globalAlpha = Math.min(1, 0.4 + p.d * 0.32);
        ctx.fill();
      }

      ctx.globalAlpha = 1;
    }

    /* Respect prefers-reduced-motion: render one static frame */
    if (reducedMotion) {
      drawFrame(0);
      return;
    }

    function frame(ts) {
      drawFrame(ts * 0.001);
      rafId = requestAnimationFrame(frame);
    }

    rafId = requestAnimationFrame(frame);

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        cancelAnimationFrame(rafId);
      } else {
        rafId = requestAnimationFrame(frame);
      }
    });
  }());
</script>
