<script>
  (function () {
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('revealed');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });

    document.querySelectorAll('.hpc-card, #gridid .hpc-item, .hpc-pic-card').forEach(function (el) {
      observer.observe(el);
    });
  })();

  window.addEventListener('load', function () {
    if (typeof bootstrap !== 'undefined') {
      document.querySelectorAll('[data-bs-ride="carousel"]').forEach(function (el) {
        bootstrap.Carousel.getOrCreateInstance(el);
      });
    }
  });

  (function () {
    var BATCH = 4;
    var card = document.getElementById('news-card');
    if (!card) return;

    var items = Array.from(card.querySelectorAll('.hpc-item'));
    if (items.length <= BATCH) return;

    var shown = BATCH;
    items.slice(shown).forEach(function (el) { el.style.display = 'none'; });

    /* If the page is too short to scroll, show everything immediately */
    if (document.documentElement.scrollHeight <= window.innerHeight + 50) {
      items.forEach(function (el) { el.style.display = ''; });
      return;
    }

    var scrollPending = false;
    function onScroll() {
      if (scrollPending) return;
      scrollPending = true;
      requestAnimationFrame(function () {
        scrollPending = false;
        var remaining = document.documentElement.scrollHeight - window.scrollY - window.innerHeight;
        if (remaining > 300) return;
        items.slice(shown, shown + BATCH).forEach(function (el) { el.style.display = ''; });
        shown += BATCH;
        if (shown >= items.length) window.removeEventListener('scroll', onScroll);
      });
    }

    window.addEventListener('scroll', onScroll, { passive: true });
  })();
</script>

<script>
  /* Rotating tesseract (Q4 hypercube) for the home page title.
     Projects 4D vertices via perspective (4D→3D) then orthographic (3D→2D),
     rotating simultaneously in the XW and YZ planes.
     Packet dots travel along each edge in screen-space each frame. */
  (function () {
    var svg = document.querySelector('.hpc-topology');
    if (!svg) return;

    var NS     = 'http://www.w3.org/2000/svg';
    var ORANGE = '#d74009';
    var BLUE   = '#158CBA';
    var DW     = 2.5;
    var SCALE  = 19;
    var CX = 50, CY = 40;

    /* 16 vertices of the unit tesseract in [-1,1]^4 */
    var verts = [];
    for (var i = 0; i < 16; i++) {
      verts.push([
        (i & 1) ? 1 : -1,
        (i & 2) ? 1 : -1,
        (i & 4) ? 1 : -1,
        (i & 8) ? 1 : -1
      ]);
    }

    /* 32 edges: pairs differing by exactly one bit */
    var edges = [];
    for (var a = 0; a < 16; a++) {
      for (var b = a + 1; b < 16; b++) {
        var xor = a ^ b;
        if (xor && !(xor & (xor - 1))) edges.push([a, b]);
      }
    }

    /* Build SVG elements — edges → packets → nodes (painter's order) */
    var edgeEls = edges.map(function () {
      var el = document.createElementNS(NS, 'line');
      svg.appendChild(el);
      return el;
    });
    var packetEls = edges.map(function () {
      var el = document.createElementNS(NS, 'circle');
      svg.appendChild(el);
      return el;
    });
    var nodeEls = verts.map(function () {
      var el = document.createElementNS(NS, 'circle');
      svg.appendChild(el);
      return el;
    });

    function project(v, t) {
      var a  = t * 0.35;
      var x  = v[0] * Math.cos(a) - v[3] * Math.sin(a);
      var w  = v[0] * Math.sin(a) + v[3] * Math.cos(a);
      var b  = t * 0.22;
      var y  = v[1] * Math.cos(b) - v[2] * Math.sin(b);
      var sw = DW / (DW - w);
      return { x: x * sw * SCALE + CX, y: y * sw * SCALE + CY, d: sw };
    }

    var rafId = null;

    function frame(ts) {
      var t   = ts * 0.001;
      var pts = verts.map(function (v) { return project(v, t); });

      edges.forEach(function (e, i) {
        var p1    = pts[e[0]], p2 = pts[e[1]];
        var d     = (p1.d + p2.d) * 0.5;
        var color = d > 1.2 ? ORANGE : BLUE;

        /* Base edge */
        var el = edgeEls[i];
        el.setAttribute('x1', p1.x.toFixed(1));
        el.setAttribute('y1', p1.y.toFixed(1));
        el.setAttribute('x2', p2.x.toFixed(1));
        el.setAttribute('y2', p2.y.toFixed(1));
        el.setAttribute('stroke', color);
        el.setAttribute('stroke-width',   (0.4 + d * 0.45).toFixed(2));
        el.setAttribute('stroke-opacity', Math.min(0.85, 0.1 + d * 0.42).toFixed(2));

        /* Packet dot — travels 0→1 along each edge, staggered via golden ratio */
        var speed = 0.20 + (i % 5) * 0.04;
        var phase = ((t * speed) + i * 0.6180) % 1;
        var pkt   = packetEls[i];
        pkt.setAttribute('cx', (p1.x + phase * (p2.x - p1.x)).toFixed(1));
        pkt.setAttribute('cy', (p1.y + phase * (p2.y - p1.y)).toFixed(1));
        pkt.setAttribute('r',  (1.2 + d * 0.35).toFixed(2));
        pkt.setAttribute('fill',         color);
        pkt.setAttribute('fill-opacity', Math.min(0.95, 0.25 + d * 0.42).toFixed(2));
      });

      nodeEls.forEach(function (el, i) {
        var p = pts[i];
        el.setAttribute('cx', p.x.toFixed(1));
        el.setAttribute('cy', p.y.toFixed(1));
        el.setAttribute('r',  Math.max(1.8, (1.8 + p.d * 1.2)).toFixed(2));
        el.setAttribute('fill',         p.d > 1.2 ? ORANGE : BLUE);
        el.setAttribute('fill-opacity', Math.min(1, 0.4 + p.d * 0.32).toFixed(2));
      });

      rafId = requestAnimationFrame(frame);
    }

    rafId = requestAnimationFrame(frame);

    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        cancelAnimationFrame(rafId);
      } else {
        rafId = requestAnimationFrame(frame);
      }
    });
  }());
</script>
