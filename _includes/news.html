<div class="hpc-card">
  <h4>News</h4>

  {% for article in site.data.news limit:9 %}
  <div class="hpc-item">
    <p class="mb-1"><strong>{{ article.date }}</strong></p>
    <p class="mb-0">{{ article.headline | markdownify }}</p>
  </div>
  {% endfor %}

  <p class="mt-2 mb-0"><a href="{{ site.url }}{{ site.baseurl }}/allnews.html">... see all News</a></p>
</div>
